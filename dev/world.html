<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Up Anyway — world lab</title>
    <style>
      html,
      body {
        margin: 0;
        background: #2b2333;
        color: #fff7ec;
        font: 13px/1.3 'Nunito Variable', system-ui, -apple-system, sans-serif;
      }
      body.play {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
      }
      .stage > canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        left: 8px;
        top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(30, 20, 30, 0.6);
        max-width: calc(100vw - 32px);
      }
      #panel select,
      #panel button,
      #panel label {
        font: inherit;
        min-height: 32px;
      }
      #stats {
        opacity: 0.8;
      }
      main.swatches {
        padding: 16px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 14px;
      }
      .zone-card {
        background: #3a2f44;
        border-radius: 14px;
        padding: 10px;
      }
      .zone-card h2 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      .zone-card canvas {
        display: block;
        width: 100%;
        height: 360px;
        border-radius: 10px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 6px;
      }
      .chip {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <script type="module" src="./world.ts"></script>
  </body>
</html>
