<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Up Anyway — Looks Scary lab</title>
    <style>
      html,
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #2b2333;
        color: #fff7ec;
        font: 13px/1.3 'Nunito Variable', system-ui, -apple-system, sans-serif;
      }
      .stage {
        position: fixed;
        inset: 0;
      }
      .stage > canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .climb-stage__safe {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
      #panel {
        position: fixed;
        left: 8px;
        top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(30, 20, 30, 0.66);
        max-width: calc(100vw - 32px);
      }
      #panel select,
      #panel button {
        font: inherit;
        min-height: 32px;
      }
      #stats {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./scary.ts"></script>
  </body>
</html>
