<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Up Anyway — character lab</title>
    <style>
      :root {
        --paper: #fbf3e4;
        --ink: #4a3040;
        --muted: #8a7480;
      }
      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 13px/1.3 system-ui, -apple-system, sans-serif;
      }
      main {
        padding: 12px 16px 40px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      section {
        margin: 0 0 14px;
        padding: 10px;
        border-radius: 12px;
        background: #fff9ef;
        box-shadow: 0 1px 0 #ead9c3;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      figcaption {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }
      canvas {
        display: block;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main id="lab">
      <h1>Up Anyway — character animator lab</h1>
      <p>
        Dev only. Live by default. <code>?t=2.4</code> freezes every cell at that many seconds;
        <code>?only=strips</code> / <code>?only=states</code>; <code>?scale=phone|ipad</code>.
      </p>
    </main>
    <script type="module" src="./character.ts"></script>
  </body>
</html>
